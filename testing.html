<html lang="en">

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-black.css">
    <title>Moon's Space - Research</title>
    <style>

    html,body,h1,h2,h3,h4,h5,h6 {font-family: 'Syne', sans-serif;}

    body {background-color: #0d1117;}

    :root { --rail: 60px; --rail-open: 250px; }

    .w3-sidebar {
      z-index: 3;
      width: var(--rail-open);
      top: 43px;
      bottom: 0;
      height: inherit;
      overflow-x: hidden;   /* w3.css sets overflow:auto — without this the 250px
                               labels force a horizontal scrollbar at 60px wide */
      overflow-y: auto;
    }

    /* ---- Sidebar row layout: fixed icon column + indented label ---- */
    #mySidebar .sb-item{
      display: flex;
      align-items: center;
      padding: 10px 0;
      white-space: nowrap;
    }
    #mySidebar .sb-icon{ flex: 0 0 var(--rail); text-align: center; }
    #mySidebar .sb-text{ padding-left: 20px; }          /* the indent */
    #mySidebar .sb-head .sb-text{ padding-left: 0; }    /* heading sits flush */
    #mySidebar .sb-head{ padding: 16px 0; }

    /* ---- Hover-to-expand, desktop only. 993px matches w3.css's own breakpoint ---- */
    @media (min-width: 993px){
      .w3-main{ margin-left: var(--rail); }

      #mySidebar{
        width: var(--rail);
        transition: width .25s ease, box-shadow .25s ease;
      }
      #mySidebar:hover,
      #mySidebar:focus-within{
        width: var(--rail-open);
        box-shadow: 0 0 24px rgba(0,0,0,.45);
      }

      #mySidebar .sb-text{ opacity: 0; transition: opacity .2s ease .05s; }
      #mySidebar:hover .sb-text,
      #mySidebar:focus-within .sb-text{ opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce){
      #mySidebar, #mySidebar .sb-text{ transition: none; }
    }

    .floating-box {
      float: left;
      width: 250px;
      height: 20px;
      margin: 3px;
    }

    /* ---- Main content: GitHub-dark, scoped to #content so it can't leak into
           the navbar, sidebar or footer ---- */
    #content{
      --gh-bg:#0d1117; --gh-fg:#e6edf3; --gh-muted:#9198a1; --gh-border:#3d444d;
      --gh-code-bg:#161b22; --gh-link:#4493f8;
      --gh-note-bg:#121d2f; --gh-note-border:#316dca;
      --gh-ph-fg:#d29922; --gh-ph-bg:rgba(187,128,9,.15); --gh-ph-border:rgba(187,128,9,.45);
      background:var(--gh-bg);
      color:var(--gh-fg);
      color-scheme:dark;
      min-height:calc(100vh - 43px);
    }
    .readme{max-width:52rem; line-height:1.65; font-size:16px}
    .readme h1{font-size:2rem; line-height:1.25; margin:0 0 .6rem; letter-spacing:-.015em}
    .readme h2{font-size:1.35rem; margin:2.6rem 0 .85rem; padding-bottom:.35rem;
               border-bottom:1px solid var(--gh-border)}
    .readme p{margin:0 0 1rem}
    .readme ul{margin:0 0 1rem; padding-left:1.4rem}
    .readme li{margin:.3rem 0}
    .readme a{color:var(--gh-link); text-decoration:none}
    .readme a:hover,.readme a:focus-visible{text-decoration:underline}
    .readme code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
                 font-size:.875em; background:var(--gh-code-bg); padding:.15em .38em; border-radius:6px}
    .readme pre{background:var(--gh-code-bg); border:1px solid var(--gh-border); border-radius:8px;
                padding:1rem; overflow-x:auto; margin:0 0 1.2rem}
    .readme pre code{background:none; padding:0; font-size:.85rem; line-height:1.55}
    .readme .lede,.readme .run{color:var(--gh-muted)}
    .readme .run{font-size:.95rem}
    .readme .note{background:var(--gh-note-bg); border-left:4px solid var(--gh-note-border);
                  border-radius:0 8px 8px 0; padding:.9rem 1rem; margin:0 0 1.2rem}
    .readme .note p:last-child{margin-bottom:0}
    .readme .ph{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.85em;
                color:var(--gh-ph-fg); background:var(--gh-ph-bg);
                border:1px dashed var(--gh-ph-border); border-radius:5px;
                padding:.05em .35em; white-space:nowrap}
    .readme var{font-style:italic; font-family:Georgia,"Times New Roman",serif}
    .readme .eq{margin:1.4rem 0; padding:1rem .5rem; overflow-x:auto; text-align:center;
                border-top:1px solid var(--gh-border); border-bottom:1px solid var(--gh-border)}
    .readme math{font-size:1.15em}

    @media print{
      body{background:#fff}
      .w3-top,.w3-sidebar,#myFooter,#myOverlay{display:none !important}
      .w3-main{margin-left:0 !important}
      #content{background:#fff; color:#000; min-height:0; padding:0 !important}
      .readme{max-width:none}
      .readme a{color:#000}
      .readme code,.readme pre{background:#f4f4f4; border-color:#bbb; color:#000}
      .readme .note{background:#f4f4f4; border-left-color:#666}
      .readme .lede,.readme .run{color:#444}
      .readme pre,.readme .note,.readme .eq{break-inside:avoid}
    }

    </style>
   </head>
